worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Kompresi Gzip untuk efisiensi bandwidth jaringan lapangan 3G/4G (SRS-RES-009)
  gzip on;
  gzip_types application/json text/plain application/javascript text/css;
  gzip_min_length 1024;

  # Batas ukuran upload multipart foto bukti K3 (2 MB + overhead header)
  client_max_body_size 3M;

  upstream hti_api_upstream {
    server api:3000;
    keepalive 16;
  }

  # Redirect permanen HTTP -> HTTPS (SRS-SEC-005)
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Mode Pemeliharaan Terkendali (SRS-MOD-003): buat file /etc/nginx/certs/maintenance.on
    if (-f /etc/nginx/certs/maintenance.on) {
      return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
      add_header Retry-After 300 always;
      add_header Content-Type application/json always;
      return 503 '{"success":false,"error":{"code":"SERVICE_MAINTENANCE","message":"Sistem sedang dalam pemeliharaan terencana. Silakan coba beberapa menit lagi."}}';
    }

    location /api/ {
      proxy_pass http://hti_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_connect_timeout 15s;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
    }
  }
}
